<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Qatar 2022</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

    <!-- Menú de Navegación -->
    <nav style="background-color: #8A1538; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 18px;">Inicio</a>
        <a href="about.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 18px;">Sobre el Mundial</a>
        <a href="contact.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 18px;">Contacto</a>
    </nav>

    <!-- Contenido Principal -->
    <div style="padding: 20px; max-width: 600px; margin: 30px auto; background-color: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h1 style="color: #8A1538; text-align: center;">Comparte tu experiencia</h1>
        <p style="text-align: center; color: #555; margin-bottom: 20px;">
            ¿Cuál fue tu momento favorito del Mundial de Qatar 2022? ¡Escríbenos!
        </p>

        <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label for="nombre" style="display: block; font-weight: bold; margin-bottom: 5px; color: #333;">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div>
                <label for="email" style="display: block; font-weight: bold; margin-bottom: 5px; color: #333;">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div>
                <label for="mensaje" style="display: block; font-weight: bold; margin-bottom: 5px; color: #333;">Tu mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí tu momento favorito..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <button type="submit" style="background-color: #8A1538; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">
                Enviar Mensaje
            </button>
        </form>
    </div>

</body>
</html>
